sonarr:
  sonarr_4k:
    base_url: !secret sonarr_4k_base_url
    api_key: !secret sonarr_4k_api_key
    delete_old_custom_formats: true
    replace_existing_custom_formats: true

    quality_profiles:
      - name: Remux + WEB 1080p
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-1080p Remux
          until_score: 10000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: Bluray-1080p Remux
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
