services:
  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    expose:
      - 8080
    volumes:
      - ${DOCKER_DATA_DIR}/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=https://${SEARXNG_HOSTNAME:-localhost}/
      - UWSGI_WORKERS=${SEARXNG_UWSGI_WORKERS:-4}
      - UWSGI_THREADS=${SEARXNG_UWSGI_THREADS:-4}
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.searxng.rule=Host(`${SEARXNG_HOSTNAME}`)"
      - "traefik.http.routers.searxng.entrypoints=websecure"
      - "traefik.http.routers.searxng.tls.certresolver=letsencrypt"
      - "traefik.http.routers.searxng.middlewares=authelia@docker"
      - "traefik.http.routers.searxng.priority=1"
      # API router — no auth, allows OpenWebUI/Ollama to query /search?format=json
      - "traefik.http.routers.searxng-api.rule=Host(`${SEARXNG_HOSTNAME}`) && Path(`/search`)"
      - "traefik.http.routers.searxng-api.entrypoints=websecure"
      - "traefik.http.routers.searxng-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.searxng-api.priority=10"
    profiles:
      - searxng
      - all
