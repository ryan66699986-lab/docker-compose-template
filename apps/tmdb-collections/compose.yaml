services:
  tmdb-collections:
    image: tmdb-collections
    container_name: tmdb-collections
    restart: unless-stopped
    build:
      context: https://github.com/youchi1/tmdb-collections.git
      dockerfile_inline: |
        FROM node:22.17-alpine
        WORKDIR /app

        # Copy package files first for better Docker layer caching
        COPY package*.json ./

        # Install build tools for native modules (sqlite3), then install deps
        RUN apk add --no-cache python3 make g++ && \
            npm ci --omit=dev && \
            npm cache clean --force && \
            apk del python3 make g++

        # Copy application files
        COPY Images ./Images
        COPY Public ./Public
        COPY lib ./lib
        COPY index.js server.js newrelic.js ./

        ENV NODE_ENV=production

        ENTRYPOINT ["npm", "start"]
    expose:
      - 5600
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tmdb-collections.rule=Host(`${TMDB_COLLECTIONS_HOSTNAME?}`)"
      - "traefik.http.routers.tmdb-collections.entrypoints=websecure"
      - "traefik.http.routers.tmdb-collections.tls.certresolver=letsencrypt"
      - "traefik.http.services.tmdb-collections.loadbalancer.server.port=5600"
      - "traefik.http.routers.tmdb-collections.middlewares=authelia@docker"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:5600/manifest.json",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - tmdb-collections
      - all